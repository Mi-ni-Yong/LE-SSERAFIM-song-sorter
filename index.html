<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LE SSERAFIM Song Sorter</title>
    <style>
        /* PUREFLOW Minimal & Fluid 테마 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            font-family: 'Pretendard', 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
            background: linear-gradient(-45deg, #fdfbfb, #f0f4f8, #fceef5, #e0f2fe);
            background-size: 400% 400%;
            animation: gradientFlow 15s ease infinite;
        }

        #container {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 20px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 50px rgba(100, 110, 140, 0.08);
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        /* 르세라핌 정체성 강조 타이틀 */
        h1 {
            margin-top: 0;
            margin-bottom: 0;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #111;
        }

        .subtitle {
            display: block;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 5px;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .logo-text {
            background: linear-gradient(90deg, #9bbde8 0%, #ffafbd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: #79a7d3; 
        }

        .version-info {
            display: block;
            color: #ff8fa3;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        #phase-title {
            font-size: 13px;
            font-weight: 800;
            color: #ff8fa3;
            margin-bottom: 10px;
            background: rgba(255, 175, 189, 0.15);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 1px;
        }
        
        /* 진행률 바 */
        .progress-wrapper {
            margin-bottom: 20px;
            text-align: left;
        }
        .progress-text-box {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
            color: #888;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .progress-bar-bg {
            background: rgba(0, 0, 0, 0.05);
            height: 5px;
            border-radius: 3px;
            overflow: hidden;
            width: 100%;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #ffc3a0 0%, #ffafbd 100%);
            height: 100%;
            width: 0%;
            border-radius: 3px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* 배틀 버튼 */
        .battle-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .choice-btn {
            flex: 1;
            min-height: 120px;
            padding: 10px;
            font-size: 16px;
            font-weight: 700;
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: keep-all;
            line-height: 1.4;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .choice-btn:hover {
            transform: translateY(-3px);
            border-color: #ffafbd;
            background: #fff;
            color: #ff8fa3;
            box-shadow: 0 10px 20px rgba(255, 175, 189, 0.2);
        }
        
        /* 유틸리티 버튼 */
        .utility-box {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 10px;
        }
        .util-btn {
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 16px;
            background-color: rgba(255, 255, 255, 0.5);
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }
        .util-btn:hover {
            background-color: #fff;
            color: #111;
            border-color: #ccc;
        }
        
        /* 메인 버튼 */
        .start-btn {
            padding: 12px 30px;
            font-size: 14px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            box-shadow: 0 5px 12px rgba(255, 175, 189, 0.4);
        }
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(255, 175, 189, 0.6);
        }
        .disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        
        /* 결과 리스트 레이아웃 */
        .result-wrapper {
            display: flex;
            gap: 15px; 
            width: 100%;
            margin-top: 10px;
        }
        .result-col-left, .result-col-right {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .result-section-title {
            text-align: left;
            margin: 0 0 5px 0;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.5px;
            height: 18px; 
            display: flex;
            align-items: center;
        }
        
        .result-list-compact {
            display: flex;
            flex-direction: column;
            gap: 2px; 
            text-align: left;
        }
        
        /* 공통 항목 디자인 (글자색 통일) */
        .result-item {
            background: rgba(255, 255, 255, 0.7); 
            padding: 3px 8px; 
            border-radius: 4px;
            font-size: 11.5px; 
            display: flex;
            align-items: center;
            transition: transform 0.2s, filter 0.2s;
        }
        .result-item:hover {
            transform: translateX(3px);
            filter: brightness(1.02);
            background: #fff;
        }
        .rank-num {
            width: 18px; 
            margin-right: 6px;
            font-size: 12px;
            font-weight: 900;
            color: #888; 
            display: inline-block;
        }
        .song-title {
            font-weight: 600;
            color: #222; 
            word-break: keep-all;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; 
        }

        /* 👑 티어별 디자인 (음영 및 왼쪽 테두리 포인트) */
        
        /* Tier 1 (1~10위) : 핑크 포인트 */
        .tier-1 {
            background: rgba(255, 175, 189, 0.15);
            border-left: 3px solid #ff8fa3;
        }
        
        /* Tier 2 (11~20위) : 스카이블루 포인트 */
        .tier-2 {
            background: rgba(121, 167, 211, 0.12);
            border-left: 3px solid #79a7d3;
        }
        
        /* Tier 3 (21~30위) : 피치(오렌지) 포인트 */
        .tier-3 {
            background: rgba(255, 195, 160, 0.15);
            border-left: 3px solid #f2a679;
        }

        /* Tier 4 (31~45위) : 연한 녹색 포인트 */
        .tier-4 {
            background: rgba(160, 220, 160, 0.15);
            border-left: 3px solid #99d999;
        }

        /* Intro & Narration : 회색 포인트 */
        .tier-intro {
            background: rgba(210, 210, 210, 0.15);
            border-left: 3px solid #cccccc;
        }
        
        /* 좁은 화면(모바일 등) */
        @media (max-width: 650px) {
            .result-wrapper {
                flex-direction: column;
                gap: 15px;
            }
            .result-section-title {
                height: auto; 
            }
        }
        
        #start-screen, #battle-screen, #result-screen {
            display: none;
        }
        .active {
            display: block !important;
        }
    </style>
</head>
<body>

<div id="container">
    <!-- 1. 시작 화면 -->
    <div id="start-screen" class="active">
        <h1><span class="logo-text">LE SSERAFIM</span></h1>
        <span class="subtitle">SONG SORTER</span>
        <span class="version-info">
            * 일반 트랙(45트랙)과 인트로/내레이션(8트랙)을 분리하여 평가합니다.<br>
            * includes up to [PUREFLOW pt.1] &  'ICONIC BY MISTAKE' 
        </span>
        <button class="start-btn" onclick="startPhase(1)">START SORTING</button>
    </div>

    <!-- 2. 배틀 화면 -->
    <div id="battle-screen">
        <div id="phase-title">PART 1 : 일반 트랙</div>
        <div class="progress-wrapper">
            <div class="progress-text-box">
                <span id="battle-count-text">BATTLE 1</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>
        
        <div class="battle-box">
            <button id="left-btn" class="choice-btn" onclick="makeChoice('left')"></button>
            <button id="right-btn" class="choice-btn" onclick="makeChoice('right')"></button>
        </div>
        <div class="utility-box">
            <button id="tie-btn" class="util-btn" onclick="makeChoice('tie')">무승부 (Tie)</button>
            <button id="undo-btn" class="util-btn" onclick="undo()">되돌리기 (Undo)</button>
        </div>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="result-screen">
        <h1 style="margin-bottom: 2px;">MY <span class="logo-text">LE SSERAFIM</span></h1>
        <span class="version-info" style="margin-bottom: 8px;">Final Ranking</span>
        
        <div class="result-wrapper">
            <!-- 왼쪽: 일반 트랙 -->
            <div class="result-col-left">
                <div class="result-section-title" style="visibility: hidden;">&nbsp;</div>
                <div id="main-result-list" class="result-list-compact"></div>
            </div>
            
            <!-- 오른쪽: 인트로 & 내레이션 트랙 -->
            <div class="result-col-right">
                <div class="result-section-title" style="color: #79a7d3;">📖 인트로 & 내레이션</div>
                <div id="narration-result-list" class="result-list-compact"></div>
            </div>
        </div>

        <button class="start-btn" style="margin-top: 20px; width: 100%;" onclick="location.reload()">TRY AGAIN</button>
    </div>
</div>

<script>
    // 53곡 전체 리스트
    const allSongs = [
        "The World Is My Oyster", "FEARLESS", "Blue Flame", "The Great Mermaid", "Sour Grapes", 
        "The Hydra", "ANTIFRAGILE", "Impurities", "No Celestial", "Good Parts (when the quality is bad but I am)", 
        "Choices", "Burn the Bridge", "UNFORGIVEN (feat. Nile Rodgers)", "No-Return (Into the unknown)", 
        "이브, 프시케 그리고 푸른 수염의 아내", "피어나 (Between you, me and the lamppost)", "Flash Forward", 
        "Fire in the belly", "Guardian", "Jewelry (Prod. imase)", "Perfect Night", "Dresscode (Prod. imase)", 
        "Good Bones", "EASY", "Swan Song", "Smart", "We got so much", "Chasing Lightning", "CRAZY", 
        "Pierrot", "1-800-hot-n-fun", "미치지 못하는 이유", "Born Fire", "HOT", "Come Over", "Ash", 
        "So Cynical (Badum)", "DIFFERENT", "Kawaii (Prod. Gen Hoshino)", "SPAGHETTI (feat. j-hope of BTS)", 
        "Pearlies (My oyster is the world)", "Pureflow", "BOOMPALA", "CELEBRATION", "Creatures", "iffy iffy", 
        "우리 어떻게 더 사귈 수 있을까 (Need Your Company)", "Sonder", "Saki (feat. Aliyah's Interlude)", 
        "Irony", "Trust Exercise", "Liminal Space", "ICONIC BY MISTAKE"
    ];

    // 인트로 & 내레이션 트랙 8곡 분류
    const narrationTracks = [
        "The World Is My Oyster", "The Hydra", "Burn the Bridge", 
        "Good Bones", "Chasing Lightning", "Pureflow", 
        "Born Fire", "Liminal Space"
    ];

    // 일반 트랙 45곡 분류
    const mainTracks = allSongs.filter(song => !narrationTracks.includes(song));

    let currentPhase = 1;
    let itemsToSort = [];
    let lists = [];
    let nextRoundLists = [];
    let leftList = [], rightList = [];
    let leftIdx = 0, rightIdx = 0;
    let merged = [];
    let battleCount = 1;
    let history = [];
    let totalProcessed = 0;
    let totalExpected = 0;
    
    let finalMainRanking = [];
    let finalNarrationRanking = [];

    function startPhase(phaseNum) {
        currentPhase = phaseNum;
        itemsToSort = (currentPhase === 1) ? mainTracks : narrationTracks;
        
        // 동률(무승부) 처리를 위해 각 곡을 배열 형태 [[곡명]] 로 감싸서 시작
        const shuffled = [...itemsToSort].sort(() => Math.random() - 0.5);
        lists = shuffled.map(item => [[item]]); 
        nextRoundLists = [];
        battleCount = 1;
        history = []; 
        
        const depth = Math.ceil(Math.log2(itemsToSort.length));
        totalExpected = itemsToSort.length * depth;
        totalProcessed = 0;
        
        document.getElementById("start-screen").classList.remove("active");
        document.getElementById("battle-screen").classList.add("active");
        
        const phaseTitle = document.getElementById("phase-title");
        if (currentPhase === 1) {
            phaseTitle.innerText = "PART 1 : 일반 트랙";
            phaseTitle.style.color = "#ff8fa3";
            phaseTitle.style.background = "rgba(255, 175, 189, 0.15)";
        } else {
            phaseTitle.innerText = "PART 2 : 인트로 & 내레이션";
            phaseTitle.style.color = "#79a7d3";
            phaseTitle.style.background = "rgba(121, 167, 211, 0.15)";
        }
        
        setupNextPair();
    }

    function setupNextPair() {
        while (lists.length < 2) {
            if (lists.length === 1) {
                nextRoundLists.push(lists.shift());
            }
            if (nextRoundLists.length <= 1) {
                if (currentPhase === 1) {
                    finalMainRanking = nextRoundLists[0] || [];
                    startPhase(2); 
                } else {
                    finalNarrationRanking = nextRoundLists[0] || [];
                    showFinalResults();
                }
                return;
            }
            lists = nextRoundLists;
            nextRoundLists = [];
        }
        
        leftList = lists.shift();
        rightList = lists.shift();
        leftIdx = 0;
        rightIdx = 0;
        merged = [];
        showBattle();
    }

    function showBattle() {
        let percent = Math.floor((totalProcessed / totalExpected) * 100);
        if (percent > 99) percent = 99; 
        
        document.getElementById("battle-count-text").innerText = `BATTLE ${battleCount}`;
        document.getElementById("progress-percent").innerText = `${percent}%`;
        document.getElementById("progress-fill").style.width = `${percent}%`;
        
        document.getElementById("left-btn").innerHTML = leftList[leftIdx].join('<br>');
        document.getElementById("right-btn").innerHTML = rightList[rightIdx].join('<br>');
        
        const undoBtn = document.getElementById("undo-btn");
        if (history.length === 0) {
            undoBtn.classList.add("disabled");
        } else {
            undoBtn.classList.remove("disabled");
        }
    }

    function saveState() {
        history.push(JSON.parse(JSON.stringify({
            lists, nextRoundLists, leftList, rightList, leftIdx, rightIdx, merged, battleCount, totalProcessed
        })));
    }

    function undo() {
        if (history.length === 0) return;
        const state = history.pop();
        lists = state.lists;
        nextRoundLists = state.nextRoundLists;
        leftList = state.leftList;
        rightList = state.rightList;
        leftIdx = state.leftIdx;
        rightIdx = state.rightIdx;
        merged = state.merged;
        battleCount = state.battleCount;
        totalProcessed = state.totalProcessed;
        showBattle();
    }

    function makeChoice(choice) {
        saveState();
        battleCount++;

        if (choice === 'left') {
            merged.push(leftList[leftIdx]);
            totalProcessed += leftList[leftIdx].length;
            leftIdx++;
        } else if (choice === 'right') {
            merged.push(rightList[rightIdx]);
            totalProcessed += rightList[rightIdx].length;
            rightIdx++;
        } else if (choice === 'tie') {
            merged.push([...leftList[leftIdx], ...rightList[rightIdx]]);
            totalProcessed += leftList[leftIdx].length + rightList[rightIdx].length;
            leftIdx++;
            rightIdx++;
        }

        if (leftIdx >= leftList.length) {
            const remainder = rightList.slice(rightIdx);
            merged.push(...remainder);
            totalProcessed += remainder.reduce((sum, group) => sum + group.length, 0);
            nextRoundLists.push(merged);
            setupNextPair();
        } else if (rightIdx >= rightList.length) {
            const remainder = leftList.slice(leftIdx);
            merged.push(...remainder);
            totalProcessed += remainder.reduce((sum, group) => sum + group.length, 0);
            nextRoundLists.push(merged);
            setupNextPair();
        } else {
            showBattle();
        }
    }

    function showFinalResults() {
        document.getElementById("battle-screen").classList.remove("active");
        document.getElementById("result-screen").classList.add("active");
        
        // 1. 왼쪽: 일반 트랙 (티어별 음영 클래스 부여)
        const mainContainer = document.getElementById("main-result-list");
        mainContainer.innerHTML = "";
        let mainRank = 1;
        
        finalMainRanking.forEach((tiedGroup) => {
            tiedGroup.forEach((song) => {
                const item = document.createElement("div");
                item.className = "result-item";
                
                // 순위 구간에 따른 티어(Tier) 클래스 할당 (31위 이상은 tier-4 연한 녹색)
                if (mainRank <= 10) item.classList.add("tier-1");
                else if (mainRank <= 20) item.classList.add("tier-2");
                else if (mainRank <= 30) item.classList.add("tier-3");
                else item.classList.add("tier-4"); 

                item.innerHTML = `
                    <span class="rank-num">${mainRank}</span>
                    <span class="song-title">${song}</span>
                `;
                mainContainer.appendChild(item);
            });
            mainRank += tiedGroup.length;
        });

        // 2. 오른쪽: 인트로 & 내레이션
        const narrationContainer = document.getElementById("narration-result-list");
        narrationContainer.innerHTML = "";
        let narRank = 1;
        
        finalNarrationRanking.forEach((tiedGroup) => {
            tiedGroup.forEach((song) => {
                const item = document.createElement("div");
                item.className = "result-item";
                
                // 내레이션 트랙은 모두 회색 포인트 (tier-intro)
                item.classList.add("tier-intro");
                
                item.innerHTML = `
                    <span class="rank-num">${narRank}</span>
                    <span class="song-title">${song}</span>
                `;
                narrationContainer.appendChild(item);
            });
            narRank += tiedGroup.length;
        });
    }
</script>
</body>
</html>
